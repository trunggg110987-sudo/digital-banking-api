spring.application.name=Digital Banking API
server.port=8080
# ===============================
# DATABASE
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/digital_banking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# LOGGING SQL
# ===============================
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# ===============================
# JACKSON
# ===============================
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:8aF2mK9xPq7LwN4rTx6Vz1BcYe5HuJ8sRm3DnQ0GaX9PfLv2KsWd7EjCtMi4ZoAb}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
